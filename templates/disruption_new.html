{% extends "base.html" %}
{% block title %}Log Disruption{% endblock %}

{% block content %}
<section class="card form-card">
  <h2>Ingest Operational Alert / Driver Note</h2>
  <form method="post" action="{{ url_for('disruptions.create_disruption') }}" class="stack">
    <label>
      Affected Route
      <select name="route_id" required>
        <option value="">Select a route...</option>
        {% for r in routes %}
          <option value="{{ r.id }}">{{ r.route_code }} — {{ r.name }} ({{ r.mode }})</option>
        {% endfor %}
      </select>
    </label>

    <label>
      Affected Stop (optional)
      <select name="affected_stop_id">
        <option value="">Network / multiple stops</option>
        {% for s in stops %}
          <option value="{{ s.id }}">{{ s.stop_code }} — {{ s.name }}</option>
        {% endfor %}
      </select>
    </label>

    <label>
      Driver Note / Operational Incident Log
      <textarea name="raw_driver_note" rows="4" required placeholder="e.g., Signal fault outside Connolly Station; trains held 15 mins northbound."></textarea>
    </label>

    <button type="submit" class="btn btn-primary">Analyze Impact &amp; Draft Alerts</button>
  </form>
</section>
{% endblock %}
