<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Transit Dispatch Engine{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="{{ url_for('dashboard.index') }}">Transit Disruption &amp; Notification Engine</a>
    </div>
    <nav>
      <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
      <a href="{{ url_for('dashboard.list_routes') }}">Routes</a>
      <a href="{{ url_for('disruptions.new_disruption_form') }}" class="btn btn-primary">+ Log Disruption</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
