{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<section class="card form-card">
  <h2>Sign in</h2>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}" class="stack" data-once>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>
      Username
      <input type="text" name="username" autocomplete="username" required maxlength="80" autofocus>
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>
</section>
{% endblock %}
